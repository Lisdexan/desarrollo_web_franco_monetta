<!DOCTYPE html>
<html lang = "es">
<head>
    <meta charset="UTF-8">
	<title>Form Validation</title>
    <link rel="stylesheet" type="text/css" href="../css/styles.css">
</head>
<body>
    <div class="main-container">
        <div id="val-box" hidden>
            <h2 id="val-msg"></h2>
            <ul id="val-list"></ul>
        </div>
            <form name="myForm" method="post" enctype="multipart/form-data">
                <p style="font-size: 30px;">Agregar aviso de Adopcion</p>
                <p style="font-size: 20px;">Lugar del Aviso</p>

                <label for="select-department">Region:</label>
                <select name="select-department" id="select-department" required>
                <option value="">Seleccione una region</option>
                </select><br>

                <label for="select-course">Comuna:</label>
                <select name="select-course" id="select-course" required>
                <option value="">Seleccione una comuna</option>
                </select><br>
                
                <label for="sector">Sector:</label>
                <input type="text" name="sector" id="sector" ><br>
                
                <P style="font-size: 20px;">Contacto de la Publicacion </P>
                
                <label for="nombre">Nombre:</label>
                <input type="text" name="nombre" id="nombre" required><br>
                
                <label for="email">Email:</label>
                <input type="email" name="email" id="email" required><br>
                
                <label for="tel">Numero de celular:</label>
                <br>
                <input type="tel" name="tel" id="tel"><br>
                <br>
                <label for="select-contacto">Contactar por: </label><br>
                <select name="select-contacto" id="select-contacto" required>
                    <option value="">Seleccione un tipo de contacto</option>
                </select><br>

                <input type="text" id="contactInput" style="display:none;"><br>
                
                <p style="font-size: 20px;">Detalles de la Mascota</p>
                <label for="tipo-mascota">Tipo de Mascota:</label>
                <select name="tipo-mascota" id="tipo-mascota" required>
                    <option value="">Seleccione un tipo de mascota</option>
                    <option value="Perro">Perro</option>
                    <option value="Gato">Gato</option>
                </select><br>
                <label for="cantidad">Cantidad:</label><br>
                <input type="number" id="cantidad" name="cantidad" step="1" min="1" required><br>
                <br>
                <label for="edad">Edad:</label><br>
                <input type="number" id="edad" name="edad" step="1" min="0" required><br>
                <br>
                <label for="tipo-edad">Tipo de Edad:</label><br>
                <select name="tipo-edad" id="tipo-edad" required>
                    <option value="">Seleccione un tipo de edad</option>
                    <option value="meses">Meses</option>
                    <option value="años">Años</option>
                </select><br>

                <label for="fecha">Fecha de entrega:</label><br>
                <input style="width: 300px; height: 50px; font-size: 20px;" type="datetime-local" id="fecha" name="fecha" required><br>
                <br>
                <label for="desc">Descripcion de la Mascota:</label><br>
                <textarea id="desc" name="desc" rows="10" cols="50"></textarea><br>
                <br>
                <label for="files">Fotos</label>
                <div id="file-container">
                    <input type="file" name="files" id="files" class="file-input" accept="image/*,.pdf" required>
                </div>
            <button type="button" id="add-photo-btn">Agregar otra foto</button><br>
            <br>
            <button id="backtomain" type="button">Volver al menu principal</button><br>
            <br>
            <button id="submit-btn" type="button">Enviar</button>
            <br>
                
                
                
        </form>
    </div>
    <script src="../js/form.js"></script>
    <script src="../js/regiones.js"></script>
    <script src="../js/validaciones.js"></script>
</body>
</html>
