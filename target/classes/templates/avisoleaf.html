<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Listado de Avisos para Evaluación</title>
	<style>
		table, th, td {
			border: 1px solid black;
			border-collapse: collapse;
			padding: 8px;
			text-align: left;
		}
		th {
			background-color: #f2f2f2;
		}
	</style>
</head>
<body>

	<h1>Listado de Avisos para Evaluación</h1>

	<table id="tabla-avisos">
		<thead>
			<tr>
				<th>ID</th>
				<th>Fecha publicación</th>
				<th>Sector</th> 
				<th>Cantidad Tipo Edad</th> 
				<th>Comuna</th>
				<th>Nota</th> 
				<th>Acción</th> 
			</tr>
		</thead>
		<tbody>
			<tr th:each="aviso : ${avisos}"> 
				<td th:text="${aviso.id}">1</td>
				<td th:text="${#temporals.format(aviso.fechaPublicacion, 'yyyy-MM-dd')}">2025-01-01</td>
				
				<td th:text="${aviso.sector}">Beauchef 859, terraza</td>
				
				<td>
					<span th:text="${aviso.cantidad}">1</span> 
					<span th:text="${#strings.toLowerCase(aviso.tipo)}">gato</span> 
					<span th:text="${aviso.edad}">2 meses</span> 
				</td>
				
				<td th:text="${aviso.comuna}">Santiago</td>
				
				<td th:text="${aviso.notaPromedio != null ? #numbers.formatDecimal(aviso.notaPromedio, 1, 1) : '-'}">-</td>
				
				<td>
					<a href="#" th:onclick="|cambiarNota(${aviso.id})|">evaluar</a>
				</td>
			</tr>
		</tbody>
	</table>

	<script th:src="@{/js/evaluacion.js}"></script>
	
</body>
</html>
