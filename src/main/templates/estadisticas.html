<!DOCTYPE html>
<html lang = "en">
<head>
    <title>Estadísticas de Adopciones</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles_global.css') }}">
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <style>
        /* Estilos básicos para centrar y espaciar los gráficos */
        .chart-container {
            min-width: 310px; 
            max-width: 800px; 
            height: 400px; 
            margin: 20px auto; 
            border: 1px solid #ccc;
            padding: 10px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <h1>Estadísticas de Avisos de Adopción</h1>
    <a href="{{ url_for('index') }}">Volver a la Portada</a>
    
    <hr>
    
    <div id="chart-avisos-por-dia" class="chart-container"></div>
    <div id="chart-avisos-por-tipo" class="chart-container"></div>
    <div id="chart-avisos-mensuales" class="chart-container"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            
            // Función genérica para manejar la carga de datos
            function fetchChartData(url, chartId, optionsFunction) {
                fetch(url)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`Error HTTP: ${response.status}`);
                        }
                        return response.json();
                    })
                    .then(data => {
                        // Llama a la función específica para configurar y dibujar el gráfico
                        Highcharts.chart(chartId, optionsFunction(data));
                    })
                    .catch(error => {
                        console.error(`Error al cargar datos para ${chartId}:`, error);
                        document.getElementById(chartId).innerHTML = 
                            `<p style="color: red; text-align: center;">Error al cargar el gráfico: ${error.message}</p>`;
                    });
            }

            // GRÁFICO 1: Avisos de adopción agregados por día (Líneas)
            fetchChartData("{{ url_for('avisos_por_dia_api') }}", 'chart-avisos-por-dia', (data) => {
                const categories = data.map(item => item.fecha);
                const counts = data.map(item => item.cantidad);
                return {
                    chart: { type: 'line' },
                    title: { text: 'Cantidad de Avisos de Adopción Agregados por Día' },
                    xAxis: { categories: categories, title: { text: 'Día' } },
                    yAxis: { title: { text: 'Cantidad de Avisos' }, allowDecimals: false, min: 0 },
                    series: [{
                        name: 'Avisos',
                        data: counts
                    }]
                };
            });

            // GRÁFICO 2: Total de avisos de adopción por tipo (Torta)
            fetchChartData("{{ url_for('avisos_por_tipo_api') }}", 'chart-avisos-por-tipo', (data) => {
                return {
                    chart: { type: 'pie' },
                    title: { text: 'Total de Avisos de Adopción por Tipo de Mascota' },
                    tooltip: { pointFormat: '{series.name}: <b>{point.y} ({point.percentage:.1f}%)</b>' },
                    plotOptions: {
                        pie: {
                            allowPointSelect: true,
                            cursor: 'pointer',
                            dataLabels: {
                                enabled: true,
                                format: '<b>{point.name}</b>: {point.y} avisos'
                            },
                            showInLegend: true
                        }
                    },
                    series: [{
                        name: 'Avisos',
                        colorByPoint: true,
                        data: data 
                    }]
                };
            });

            // GRÁFICO 3: Avisos de adopción por mes y tipo (Barras agrupadas)
            fetchChartData("{{ url_for('avisos_mensuales_por_tipo_api') }}", 'chart-avisos-mensuales', (data) => {
                return {
                    chart: { type: 'column' },
                    title: { text: 'Avisos de Adopción por Mes y Tipo' },
                    xAxis: { categories: data.categories, title: { text: 'Mes' } },
                    yAxis: { title: { text: 'Cantidad' }, allowDecimals: false, min: 0 },
                    plotOptions: {
                        column: {
                            stacking: 'normal' // Puedes usar 'normal' o 'null' para apilado o agrupado
                        }
                    },
                    series: data.series // data.series debe venir con el formato [{name: 'Perros', data: [X, Y]}, ...]
                };
            });
        });
    </script>
</body>
</html>
